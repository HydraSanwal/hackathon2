openapi: 3.0.0
info:
  title: Docusaurus RAG Chatbot API
  description: API for the RAG-based chatbot integrated with Docusaurus book
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://your-deployment-url.com
    description: Production server

paths:
  /api/chat:
    post:
      summary: Send a message to the chatbot
      description: Process user message and return AI-generated response based on book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The user's message/question
                  example: "What is the main concept of ROS 2?"
                session_id:
                  type: string
                  description: Optional session identifier for maintaining conversation context
                  example: "sess_abc123"
                selected_text:
                  type: string
                  description: Optional text that was selected by the user when asking the question
                  example: "ROS 2 is a flexible framework for writing robot applications"
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The AI-generated response
                    example: "ROS 2 is a flexible framework for writing robot applications..."
                  session_id:
                    type: string
                    description: The session identifier (newly created if not provided)
                    example: "sess_abc123"
                  context_used:
                    type: array
                    items:
                      type: string
                    description: The book content chunks used to generate the response
        '400':
          description: Bad request - invalid input
        '500':
          description: Internal server error

  /api/health:
    get:
      summary: Health check endpoint
      description: Verify that all services are running and connected
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  services:
                    type: object
                    properties:
                      qdrant:
                        type: boolean
                        example: true
                      postgres:
                        type: boolean
                        example: true
                      gemini:
                        type: boolean
                        example: true
        '500':
          description: One or more services are not available

  /api/embedding:
    post:
      summary: Generate embeddings for text
      description: Create vector embeddings for the provided text using the configured model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: The text to generate embeddings for
                  example: "Robot Operating System concepts"
      responses:
        '200':
          description: Embedding generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding:
                    type: array
                    items:
                      type: number
                    description: The generated embedding vector
                    example: [0.1, 0.3, -0.2, 0.8]
        '400':
          description: Bad request - invalid input
        '500':
          description: Internal server error